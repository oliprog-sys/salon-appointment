version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurasalon_postgres
    environment:
      POSTGRES_USER: aurasalon_user
      POSTGRES_PASSWORD: aurasalon_password
      POSTGRES_DB: aurasalon_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aurasalon_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: